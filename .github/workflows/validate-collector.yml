name: Windows inventory validation

on:
  push:
    branches: [main]
    paths:
      - packages/hardware-inventory/**
      - .github/workflows/validate-collector.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'packages\hardware-inventory\tools\Raccogli-Dati.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'Invalid PowerShell syntax' }
      - name: Run the inventory collector on the Windows runner
        shell: powershell
        run: |
          & .\packages\hardware-inventory\tools\Raccogli-Dati.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'lenovo-collector') -SkipToolDownload -NoOpenFolder
          if ($LASTEXITCODE -ne 0) { throw 'Collection failed' }
      - name: Validate archive and exported data
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'lenovo-collector'
          $zip = Get-ChildItem $root -Filter '*.zip' | Select-Object -First 1
          if (-not $zip -or $zip.Length -eq 0) { throw 'ZIP missing' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'lenovo-collector-verifica'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          $statusFile = Get-ChildItem $unpacked -Filter 'stato-raccolta.json' -Recurse | Select-Object -First 1
          $status = Get-Content $statusFile.FullName -Raw | ConvertFrom-Json
          if ($status.SchemaVersion -ne 1 -or $status.DeviceCount -le 0) { throw 'Invalid inventory' }
          if (-not (Get-ChildItem $unpacked -Filter 'sistema.json' -Recurse)) { throw 'System data missing' }
          if (-not (Get-ChildItem $unpacked -Filter 'dispositivi.csv' -Recurse)) { throw 'CSV missing' }
          if (Get-ChildItem $unpacked -Include 'MSDM*','SLIC*' -File -Recurse) { throw 'Unexpected table in ZIP' }
          Write-Host ('ZIP verified; devices: ' + $status.DeviceCount + '; status: ' + $status.CollectionStatus)
