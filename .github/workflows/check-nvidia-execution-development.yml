name: Check NVIDIA global RM and GSP development sources

on:
  push:
    branches: [main]
    paths:
      - 'packages/nvidia-global-rm/**'
      - 'packages/nvidia-global-rm-crypto/**'
      - 'packages/nvidia-darwin-services/**'
      - 'packages/nvidia-device-transport/**'
      - 'packages/nvidia-gsp-bootstrap/**'
      - 'builders/compile_nvidia_global_rm.py'
      - 'builders/embed_nvidia_firmware.py'
      - 'builders/check_nvidia_global_crypto.py'
      - 'builders/check_nvidia_execution.py'
      - 'builders/check_nvidia_global_lifecycle.py'
      - 'builders/nvidia_execution_commands.py'
      - 'builders/nvidia_execution_closure.py'
      - 'builders/nvidia_metaclass_initializers.py'
      - 'builders/nvidia_stack_usage.py'
      - 'builders/nvidia_nvoc_stack_dispatch.py'
      - 'builders/build_nvidia_execution.py'
      - '.github/workflows/check-nvidia-execution-development.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-development:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Verify compiler diagnostics and native kernel link
        run: python3 packages/nvidia-global-rm/tests/test_compile_diagnostics.py
      - name: Verify checked source isolation and complete execution closure controls
        env:
          S540_NVOC_TEST_EVIDENCE_DIR: build/nvidia-execution/tooling-controls/nvoc-relative-output
        run: |
          python3 packages/nvidia-global-rm/tests/test_checked_source.py
          python3 packages/nvidia-global-rm/tests/test_execution_closure.py
          python3 packages/nvidia-global-rm/tests/test_stack_usage.py
          python3 packages/nvidia-global-rm/tests/test_nvoc_stack_dispatch.py
      - name: Check native Darwin services before full RM compilation
        run: >-
          python3 builders/check_nvidia_execution.py --services-preflight
          --output-dir build/nvidia-execution/services-preflight
      - name: Verify the actual kernel power-service metaclass before full RM compilation
        run: >-
          python3 builders/build_nvidia_execution.py --metaclass-preflight
          --kernel-sdk build-src/MacKernelSDK
          --output-dir build/nvidia-execution/metaclass-preflight
      - name: Compile the original baseline and checked RM source and header profiles
        run: >-
          python3 builders/compile_nvidia_global_rm.py
          --upstream build-src/nvidia-upstream --generate-namespace --checked-cleanup-overlays
          --output-dir build/nvidia-execution/original-rm
      - name: Verify callback and refusal source contracts against the pinned originals
        run: |
          python3 packages/nvidia-global-rm/tests/test_feature_profile_contracts.py --upstream build-src/nvidia-upstream
          python3 packages/nvidia-global-rm-crypto/tests/test_crypto_provenance.py --upstream build-src/nvidia-upstream
          python3 packages/nvidia-device-transport/tests/test_memory_failure_provenance.py --upstream build-src/nvidia-upstream
      - name: Compile the isolated prospective statusful adapter without approving it
        run: >-
          python3 packages/nvidia-gsp-bootstrap/adapter/tests/check_unwind_compile.py
          --upstream build-src/nvidia-upstream
          --checked-source build/nvidia-execution/original-rm/checked-source
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --output build/nvidia-execution/prospective-checks/adapter-compile
      - name: Exercise prospective adapter error propagation with explicit hardware fixtures
        run: >-
          python3 packages/nvidia-gsp-bootstrap/adapter/tests/check_unwind_bodies.py
          --upstream build-src/nvidia-upstream
          --checked-source build/nvidia-execution/original-rm/checked-source
          --cc /usr/bin/clang
          --output build/nvidia-execution/prospective-checks/adapter-bodies
      - name: Compile the isolated combined prospective original-source profile
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective/check_combined_profile.py
          --repo . --upstream build-src/nvidia-upstream
          --checked-source build/nvidia-execution/original-rm/checked-source
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --cc /usr/bin/clang
          --output build/nvidia-execution/prospective-checks/combined-profile
      - name: Compile the second isolated prospective profile with memory and timer status fixes
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-v2/check_combined_profile.py
          --repo . --upstream build-src/nvidia-upstream
          --checked-source build/nvidia-execution/original-rm/checked-source
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --cc /usr/bin/clang
          --output build/nvidia-execution/prospective-checks/combined-profile-v2
      - name: Exercise second-profile epoch, log, timer and memory failure controls
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-v2/check_body_controls.py
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --output build/nvidia-execution/prospective-checks/v2-bodies
      - name: Exercise checked timer boundaries and original event retirement ordering
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-timer-checked/check_timer_checked.py
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --output build/nvidia-execution/prospective-checks/timer-checked
      - name: Compile the third isolated profile with the actual checked timer port
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-v3/check_combined_profile.py
          --repo . --upstream build-src/nvidia-upstream
          --checked-source build/nvidia-execution/original-rm/checked-source
          --v2-output build/nvidia-execution/prospective-checks/combined-profile-v2
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --cc /usr/bin/clang --cxx /usr/bin/clang++
          --kernel-sdk build-src/MacKernelSDK
          --timer-control-report build/nvidia-execution/prospective-checks/timer-checked/timer-checked-controls.json
          --output build/nvidia-execution/prospective-checks/combined-profile-v3
      - name: Verify the isolated idle loader and privileged one-shot refusal
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-loader/check_loader.py
          --output-dir build/nvidia-execution/prospective-checks/loader
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --sdk build-src/MacKernelSDK
      - name: Exercise revocation of the actual original wait bodies in user space
        run: >-
          python3 packages/nvidia-gsp-bootstrap/cancellation/check_cancellation.py
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --output build/nvidia-execution/prospective-checks/cancellation
      - name: Exercise prospective GSP teardown errors with explicit hardware fixtures
        run: >-
          python3 packages/nvidia-gsp-bootstrap/cancellation/check_gsp_teardown_status.py
          --upstream build-src/nvidia-upstream
          --cxx /usr/bin/clang++
          --output build/nvidia-execution/prospective-checks/gsp-teardown
      - name: Exercise conditional RM lock cancellation with real Darwin service controls
        run: >-
          python3 packages/nvidia-gsp-bootstrap/cancellation/check_rm_lock_cancellation.py
          --upstream build-src/nvidia-upstream --cc /usr/bin/clang --cxx /usr/bin/clang++
          --output build/nvidia-execution/prospective-checks/rm-locks
      - name: Exercise original Falcon reset and optional capability status edges
        run: >-
          python3 packages/nvidia-gsp-bootstrap/cancellation/check_original_status_edges.py
          --upstream build-src/nvidia-upstream --cxx /usr/bin/clang++
          --output build/nvidia-execution/prospective-checks/status-edges
      - name: Exercise prospective memory ownership failures in actual original bodies
        run: >-
          python3 packages/nvidia-device-transport/prospective/check_memory_unwind_bodies.py
          --upstream build-src/nvidia-upstream --cc /usr/bin/clang
          --output build/nvidia-execution/prospective-checks/memory-unwind
      - name: Install the pinned bounded archive decoder in a private environment
        shell: bash
        run: |
          set -euo pipefail
          NVIDIA_BUILD_VENV="$RUNNER_TEMP/nvidia-execution-python"
          python3 -m venv "$NVIDIA_BUILD_VENV"
          "$NVIDIA_BUILD_VENV/bin/python3" -m pip install --disable-pip-version-check -r packages/nvidia-firmware-assets/requirements-build.txt
          printf '%s\n' "$NVIDIA_BUILD_VENV/bin" >> "$GITHUB_PATH"
      - name: Verify the actual unmodified firmware pair and complete license
        run: >-
          python3 builders/check_nvidia_firmware_assets.py --download
          --assets-dir build/nvidia-execution/firmware
          --build-dir build/nvidia-execution/firmware-checks
      - name: Check production CPU services and explicit native backend fixtures
        run: >-
          python3 builders/check_nvidia_execution.py
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --assets-dir build/nvidia-execution/firmware
          --output-dir build/nvidia-execution/native-checks
      - name: Compile the actual Darwin execution bridges without making a candidate
        run: >-
          python3 builders/build_nvidia_execution.py
          --upstream build-src/nvidia-upstream
          --kernel-sdk build-src/MacKernelSDK
          --assets-dir build/nvidia-execution/firmware
          --compiled-directory build/nvidia-execution/original-rm
          --checked-cleanup-overlays
          --output-dir build/nvidia-execution/kernel-checks
      - name: Execute the checked original global lifecycle and every allocation failure in user space
        run: >-
          python3 builders/check_nvidia_global_lifecycle.py
          --upstream build-src/nvidia-upstream
          --namespace build/nvidia-execution/original-rm/original/contract/S540GlobalRmNamespace.h
          --output-dir build/nvidia-execution/original-global-lifecycle
      - name: Verify that the linked first-transaction roots exclude unavailable user pinning
        run: >-
          python3 packages/nvidia-device-transport/tests/test_memory_failure_provenance.py
          --upstream build-src/nvidia-upstream
          --link-report build/nvidia-execution/kernel-checks/execution-kernel-build.json
      - name: Verify one actual typed NVOC dispatch against native IR and machine code
        run: >-
          python3 builders/nvidia_nvoc_stack_dispatch.py
          --capture build/nvidia-execution/original-rm/checked-namespaced/kernel_gsp.stack.json
          --output build/nvidia-execution/kernel-checks/nvoc-reset-stack-proof
      - name: Record the unresolved production milestone explicitly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path('build/nvidia-execution/kernel-checks/execution-kernel-build.json').read_text())
          assert record['production_candidate_allowed'] is False
          assert record['checked_cleanup_overlays'] is True
          assert record['original_header_profile'] == 'checked-cleanup-development'
          assert record['original_rm']['source_profile'] == 'checked-cleanup-development'
          assert record['execution_closure']['link_control_status'] == 'passed'
          assert record['execution_closure']['executable'] is False
          print('Development validation only: full adapter/GSP runtime closure remains unresolved.')
          print('No candidate ZIP, firmware upload, GPU initialization, or kernel runtime success is produced by this workflow.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-execution-development-validation
          path: |
            build/nvidia-execution/tooling-controls/**
            build/nvidia-execution/original-rm/darwin-compile.json
            build/nvidia-execution/original-rm/dependency-controls.json
            build/nvidia-execution/original-rm/checked-darwin-compile.json
            build/nvidia-execution/original-rm/checked-source-manifest.json
            build/nvidia-execution/original-rm/checked-namespaced/darwin-compile.json
            build/nvidia-execution/original-rm/checked-namespaced/dependency-controls.json
            build/nvidia-execution/original-rm/original/darwin-compile.json
            build/nvidia-execution/original-rm/original/contract/SOURCE-CONTRACT.json
            build/nvidia-execution/original-rm/namespaced/darwin-compile.json
            build/nvidia-execution/original-rm/**/compile-results.json
            build/nvidia-execution/original-rm/**/*.su
            build/nvidia-execution/original-rm/**/*.stack.json
            build/nvidia-execution/original-rm/**/stack-usage-*.json
            build/nvidia-execution/original-rm/checked-namespaced/*.stack-graph.json
            build/nvidia-execution/original-rm/checked-namespaced/*.o
            build/nvidia-execution/original-rm/**/*dependency-control.log
            build/nvidia-execution/services-preflight/**/*.json
            build/nvidia-execution/services-preflight/**/*.log
            build/nvidia-execution/metaclass-preflight/**/*.json
            build/nvidia-execution/metaclass-preflight/**/*.log
            build/nvidia-execution/metaclass-preflight/*.o
            build/nvidia-execution/firmware-checks/firmware-assets-checks.json
            build/nvidia-execution/native-checks/execution-checks.json
            build/nvidia-execution/native-checks/**/*.json
            build/nvidia-execution/native-checks/**/*.log
            build/nvidia-execution/kernel-checks/execution-kernel-build.json
            build/nvidia-execution/kernel-checks/**/*.json
            build/nvidia-execution/kernel-checks/**/*.log
            build/nvidia-execution/kernel-checks/execution-bridge.o
            build/nvidia-execution/kernel-checks/S540NvidiaGspPower.o
            build/nvidia-execution/kernel-checks/sdk-power-metaclass-reference.o
            build/nvidia-execution/kernel-checks/**/*.su
            build/nvidia-execution/kernel-checks/**/*.stack.json
            build/nvidia-execution/kernel-checks/**/*.stack-graph.json
            build/nvidia-execution/kernel-checks/nvoc-reset-stack-proof/*.o
            build/nvidia-execution/kernel-checks/nvoc-reset-stack-proof/*.ll
            build/nvidia-execution/kernel-checks/nvoc-reset-stack-proof/*.c
            build/nvidia-execution/prospective-checks/**/*.json
            build/nvidia-execution/prospective-checks/**/*.log
            build/nvidia-execution/prospective-checks/adapter-compile/*.o
            build/nvidia-execution/original-global-lifecycle/**/*.json
            build/nvidia-execution/original-global-lifecycle/**/*.log
          if-no-files-found: warn
          retention-days: 30
