name: Resume NVIDIA idle link from verified native inputs

on:
  push:
    branches: [codex/nvidia-idle-cache-link-20261020]
    paths: ['.github/workflows/resume-nvidia-idle-link-once.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nvidia-idle-link-continuation
  cancel-in-progress: false

env:
  NVIDIA_CANONICAL_ROOT: /Users/runner/work/Lenovo-IdeaPad-S540-15IWL-GTX-OSX86/Lenovo-IdeaPad-S540-15IWL-GTX-OSX86
  NVIDIA_CACHE_REPORT_SHA256: 3875dfb142cf040882d58e94f52cf260f493ebb0d06c07e80f810f5898f2f5aa

jobs:
  source-cache-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Refuse overlapping native jobs and verify cached source replay
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p "$NVIDIA_CANONICAL_ROOT"
          sudo chown -R "$(id -u):$(id -g)" /Users/runner
          cp -a "$GITHUB_WORKSPACE/." "$NVIDIA_CANONICAL_ROOT/"
          cd "$NVIDIA_CANONICAL_ROOT"
          python3 builders/check_nvidia_idle_resume_cache.py --output "$RUNNER_TEMP/cache-receipt.json" --linux-source-preflight
      - name: Check strict link and package controls
        working-directory: /Users/runner/work/Lenovo-IdeaPad-S540-15IWL-GTX-OSX86/Lenovo-IdeaPad-S540-15IWL-GTX-OSX86
        run: |
          python3 builders/link_nvidia_first_transaction.py --self-test
          python3 packages/nvidia-global-rm/tests/test_first_transaction_composition.py
          python3 packages/nvidia-global-rm/tests/test_combined_metaclasses.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-idle-cache-source-preflight
          path: ${{ runner.temp }}/cache-receipt.json
          if-no-files-found: warn
          retention-days: 7

  native-link-and-package:
    needs: source-cache-preflight
    runs-on: macos-15-intel
    timeout-minutes: 12
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Restore verified native objects without recompiling source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PWD" = "$NVIDIA_CANONICAL_ROOT"
          test -d "$DEVELOPER_DIR"
          python3 builders/check_nvidia_idle_resume_cache.py --output "$RUNNER_TEMP/cache-receipt.json"
      - name: Relink and prove the closed idle image
        run: >-
          python3 builders/link_nvidia_first_transaction.py
          --upstream build-src/nvidia-upstream
          --v3-root build/nvidia-idle-image/inputs/v3
          --namespace build/nvidia-idle-image/inputs/baseline/contract/S540GlobalRmNamespace.h
          --kernel-sdk build-src/MacKernelSDK
          --assets-dir build/nvidia-idle-image/firmware
          --output build/nvidia-idle-image/first-transaction-image
          --resume-compiled-report build/nvidia-idle-image/first-transaction-image/cached-native-compilation-report.json
          --resume-report-sha256 3875dfb142cf040882d58e94f52cf260f493ebb0d06c07e80f810f5898f2f5aa
          --retained-diagnostic --rc-participant --shutdown-protocol --platform-closure
          --retained-backends --global-epoch --live-abi-closure
      - name: Independently verify and package the idle loader ABI test
        run: python3 builders/package_nvidia_idle_resume.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S540-idle-complete-image-ABI-test
          path: build/nvidia-idle-image/package-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-idle-link-continuation-diagnostics
          path: |
            ${{ runner.temp }}/cache-receipt.json
            build/nvidia-idle-image/first-transaction-image/*.json
            build/nvidia-idle-image/first-transaction-image/*.log
            build/nvidia-idle-image/first-transaction-image/*.macho
            build/nvidia-idle-image/first-transaction-image/*.o
          if-no-files-found: warn
          retention-days: 30
