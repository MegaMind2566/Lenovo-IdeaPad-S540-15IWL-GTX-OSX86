name: Build NVIDIA complete-image idle loader ABI package

on:
  push:
    branches: [main]
    paths:
      - 'builders/**'
      - 'packages/nvidia-global-rm/**'
      - 'packages/nvidia-global-rm-crypto/**'
      - 'packages/nvidia-darwin-services/**'
      - 'packages/nvidia-device-transport/**'
      - 'packages/nvidia-hardware-transport/**'
      - 'packages/nvidia-firmware-assets/**'
      - 'packages/nvidia-os-adapter/**'
      - 'packages/nvidia-gsp-bootstrap/**'
      - '.github/workflows/build-nvidia-idle-image.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-idle-image:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Verify source replay and strict link tooling controls
        run: |
          python3 builders/prepare_nvidia_idle_image_inputs.py --self-test
          python3 packages/nvidia-global-rm/tests/test_first_transaction_composition.py
          python3 packages/nvidia-global-rm/tests/test_combined_metaclasses.py
          python3 builders/link_nvidia_first_transaction.py --self-test
      - name: Install the pinned bounded archive decoder
        shell: bash
        run: |
          set -euo pipefail
          NVIDIA_IDLE_VENV="$RUNNER_TEMP/nvidia-idle-image-python"
          python3 -m venv "$NVIDIA_IDLE_VENV"
          "$NVIDIA_IDLE_VENV/bin/python3" -m pip install --disable-pip-version-check -r packages/nvidia-firmware-assets/requirements-build.txt
          printf '%s\n' "$NVIDIA_IDLE_VENV/bin" >> "$GITHUB_PATH"
      - name: Acquire and verify the actual firmware pair and complete notice
        run: >-
          python3 builders/check_nvidia_firmware_assets.py --download
          --assets-dir build/nvidia-idle-image/firmware
          --build-dir build/nvidia-idle-image/firmware-checks
      - name: Verify packaging with actual acquired assets and native decoder controls
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-complete-image-package/check.py
          --cc /usr/bin/clang
          --assets-dir build/nvidia-idle-image/firmware
          --output build/nvidia-idle-image/package-controls
      - name: Compile raw originals for the namespace and replay exact source-only V3 inputs
        run: >-
          python3 builders/prepare_nvidia_idle_image_inputs.py
          --upstream build-src/nvidia-upstream --compiler /usr/bin/clang
          --output build/nvidia-idle-image/inputs
      - name: Verify the exact relocated V3 namespace with the actual compiler
        run: >-
          python3 packages/nvidia-gsp-bootstrap/prospective-work-gpu-binding/check_namespace_guard.py
          --baseline build/nvidia-idle-image/inputs/baseline/contract/S540GlobalRmNamespace.h
          --cc /usr/bin/clang
          --output build/nvidia-idle-image/namespace-controls
      - name: Compile and strictly link fresh 1100 original plus 60 project plus 3 runtime inputs
        run: >-
          python3 builders/link_nvidia_first_transaction.py
          --upstream build-src/nvidia-upstream
          --v3-root build/nvidia-idle-image/inputs/v3
          --namespace build/nvidia-idle-image/inputs/baseline/contract/S540GlobalRmNamespace.h
          --kernel-sdk build-src/MacKernelSDK
          --assets-dir build/nvidia-idle-image/firmware
          --output build/nvidia-idle-image/first-transaction-image
          --retained-diagnostic --rc-participant --shutdown-protocol --platform-closure
          --retained-backends --global-epoch --live-abi-closure
      - name: Independently verify, sign and package the idle complete image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys
          import zipfile
          home = Path('build/nvidia-idle-image')
          report = home/'first-transaction-image/first-transaction-image.json'
          record = json.loads(report.read_bytes())
          assert record['source_plan']['complete_original_translation_units'] == 1100
          assert record['source_plan']['canonical_project_translation_units'] == 60
          assert record['source_plan']['total_expected_link_objects'] == 1163
          assert len(record['input_object_sha256']) == 1163
          assert record['original_compilation_performed'] is True
          assert record['project_compilation_performed'] is True
          digest = hashlib.sha256(report.read_bytes()).hexdigest()
          output = home/'idle-complete-image-package'
          subprocess.run([sys.executable,
              'packages/nvidia-gsp-bootstrap/prospective-complete-image-package/package.py',
              '--report', str(report), '--report-sha256', digest,
              '--kernel-sdk', 'build-src/MacKernelSDK', '--assets-dir', str(home/'firmware'),
              '--output', str(output), '--cc', '/usr/bin/clang', '--cxx', '/usr/bin/clang++'], check=True)
          artifacts = home/'package-artifacts'
          artifacts.mkdir()
          archive = artifacts/'S540IdleCompleteImageABI.zip'
          with zipfile.ZipFile(archive, 'x', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as bundle:
              for path in sorted(output.rglob('*')):
                  if path.is_symlink():
                      raise ValueError('Package symlinks are not admitted')
                  if path.is_file():
                      bundle.write(path, 'S540IdleCompleteImageABI/'+str(path.relative_to(output)))
          attestation = output/'packaging-attestation.json'
          digests = {'archive': archive.name,
              'archive_sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'packaging_attestation_sha256': hashlib.sha256(attestation.read_bytes()).hexdigest(),
              'strict_native_report_sha256': digest, 'expected_native_link_inputs': 1163,
              'test_scope': 'idle complete-image target-loader ABI only',
              'original_entry_admission': False, 'gpu_initialization_attempted': False}
          (artifacts/'package-digests.json').write_text(json.dumps(digests, indent=2, sort_keys=True)+'\n')
          print(json.dumps(digests, indent=2, sort_keys=True))
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S540-idle-complete-image-ABI-test
          path: build/nvidia-idle-image/package-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-idle-image-native-validation
          path: |
            build/nvidia-idle-image/**/*.json
            build/nvidia-idle-image/**/*.log
            build/nvidia-idle-image/**/*.o
            build/nvidia-idle-image/**/*.su
            build/nvidia-idle-image/**/*.macho
            build/nvidia-idle-image/**/*.bin
            build/nvidia-idle-image/firmware/NVIDIA-DRIVER-LICENSE.txt
          if-no-files-found: warn
          retention-days: 30
