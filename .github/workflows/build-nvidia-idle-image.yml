name: Build NVIDIA complete-image idle loader ABI package

on:
  push:
    branches: [main]
    paths:
      # Add/update this file only for a reviewed native validation request.
      # The head commit must also contain [native ci].
      - '.github/native-ci/nvidia-idle-request.json'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native ci]'))) && 'native' || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  source-cache-preflight:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native ci]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Refuse overlapping native workflows and fetch the pinned cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 builders/prepare_nvidia_public_callback_rebuild.py
          --download-cache
          --artifact-root "$RUNNER_TEMP/nvidia-idle-4939252-native"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Run source, selective-cache, export and strict-link controls
        shell: bash
        run: |
          set -euo pipefail
          python3 builders/prepare_nvidia_idle_image_inputs.py --self-test
          python3 packages/nvidia-global-rm/tests/test_first_transaction_composition.py
          python3 packages/nvidia-global-rm/tests/test_combined_metaclasses.py
          python3 packages/nvidia-global-rm/tests/test_selective_native_cache.py
          python3 packages/nvidia-global-rm/tests/test_phase_byte_snapshot.py
          python3 packages/nvidia-global-rm/tests/test_native_cache_report_checkpoints.py
          python3 packages/nvidia-global-rm/tests/test_public_callback_rebuild_inputs.py
          python3 builders/test_nvidia_public_kpi_exports.py
          python3 builders/link_nvidia_first_transaction.py --self-test
          python3 packages/nvidia-darwin-services/tests/test_provenance.py
      - name: Replay the verified namespace and both exact source profiles without compiling originals
        run: >-
          python3 builders/prepare_nvidia_public_callback_rebuild.py
          --artifact-root "$RUNNER_TEMP/nvidia-idle-4939252-native"
          --upstream build-src/nvidia-upstream
          --output build/nvidia-idle-image/inputs
          --compose-check
      - name: Exercise base and actual composed KERNEL callback paths
        shell: bash
        run: |
          set -euo pipefail
          python3 packages/nvidia-gsp-bootstrap/prospective-public-callback-closure/check.py
          python3 packages/nvidia-gsp-bootstrap/prospective-public-callback-closure/check.py --sanitize
          python3 packages/nvidia-gsp-bootstrap/prospective-public-callback-closure/check.py \
          --source-root build/nvidia-idle-image/inputs/compose-check-baseline/project \
          --output build/nvidia-idle-image/callback-composed-plain.json
          python3 packages/nvidia-gsp-bootstrap/prospective-public-callback-closure/check.py \
          --source-root build/nvidia-idle-image/inputs/compose-check-baseline/project --sanitize \
          --output build/nvidia-idle-image/callback-composed-sanitized.json
      - name: Verify cached firmware, complete notice and package decoder controls with Clang
        shell: bash
        env:
          CC: clang
          CXX: clang++
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/nvidia-idle-4939252-native/firmware" build/nvidia-idle-image/firmware
          python3 builders/check_nvidia_firmware_assets.py \
          --assets-dir build/nvidia-idle-image/firmware \
          --build-dir build/nvidia-idle-image/firmware-checks
          python3 packages/nvidia-gsp-bootstrap/prospective-complete-image-package/check.py \
          --cc "$(command -v clang)" --assets-dir build/nvidia-idle-image/firmware \
          --output build/nvidia-idle-image/package-controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-public-callback-source-preflight
          path: |
            build/nvidia-idle-image/**/*.json
            build/nvidia-idle-image/**/*.log
          if-no-files-found: warn
          retention-days: 7

  native-link-and-package:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native ci]')) }}
    needs: source-cache-preflight
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Recheck no-overlap guard and fetch the independently pinned native cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 builders/prepare_nvidia_public_callback_rebuild.py
          --download-cache
          --artifact-root "$RUNNER_TEMP/nvidia-idle-4939252-native"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NVIDIA/open-gpu-kernel-modules
          ref: 1a82fbfda8f321b056eb3568850f9316c5e465c5
          path: build-src/nvidia-upstream
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: acidanthera/MacKernelSDK
          ref: 3f750085caa17ec3a7880f11c11bf4f48cd6a164
          path: build-src/MacKernelSDK
          persist-credentials: false
      - name: Replay frozen V3 sources and the verified cached namespace without baseline recompilation
        run: >-
          python3 builders/prepare_nvidia_public_callback_rebuild.py
          --artifact-root "$RUNNER_TEMP/nvidia-idle-4939252-native"
          --upstream build-src/nvidia-upstream
          --output build/nvidia-idle-image/inputs
      - name: Reverify actual cached firmware and native package decoder controls
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RUNNER_TEMP/nvidia-idle-4939252-native/firmware" build/nvidia-idle-image/firmware
          python3 builders/check_nvidia_firmware_assets.py \
          --assets-dir build/nvidia-idle-image/firmware \
          --build-dir build/nvidia-idle-image/firmware-checks
          python3 packages/nvidia-gsp-bootstrap/prospective-complete-image-package/check.py \
          --cc /usr/bin/clang --assets-dir build/nvidia-idle-image/firmware \
          --output build/nvidia-idle-image/package-controls
          python3 packages/nvidia-gsp-bootstrap/prospective-work-gpu-binding/check_namespace_guard.py \
          --baseline build/nvidia-idle-image/inputs/baseline/contract/S540GlobalRmNamespace.h \
          --cc /usr/bin/clang --output build/nvidia-idle-image/namespace-controls
      - name: Rebuild only Work and Timer; revalidate 1100 original and 58 unchanged project objects and both links
        run: >-
          python3 builders/link_nvidia_first_transaction.py
          --upstream build-src/nvidia-upstream
          --v3-root build/nvidia-idle-image/inputs/v3
          --namespace build/nvidia-idle-image/inputs/baseline/contract/S540GlobalRmNamespace.h
          --kernel-sdk build-src/MacKernelSDK
          --assets-dir build/nvidia-idle-image/firmware
          --output build/nvidia-idle-image/first-transaction-image
          --native-object-cache "$RUNNER_TEMP/nvidia-idle-4939252-native"
          --retained-diagnostic --rc-participant --shutdown-protocol --platform-closure
          --retained-backends --global-epoch --live-abi-closure --public-callback-closure
      - name: Require the exact selective rebuild and independent public export proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          record = json.loads(Path('build/nvidia-idle-image/first-transaction-image/first-transaction-image.json').read_bytes())
          assert record['native_compilation_selectively_reused'] is True
          cache = record['selective_native_compilation_cache']
          assert cache['complete'] is True
          assert cache['original']['reused_objects'] == 1100
          assert cache['original']['compiled_this_run'] == 0
          assert cache['project']['reused_objects'] == 58
          assert cache['project']['compiled_this_run'] == 2
          changed = {name for name, row in cache['project']['sources'].items() if row['compiled_this_run']}
          assert changed == {
              'packages/nvidia-darwin-services/src/S540NvidiaDarwinTimer.cpp',
              'packages/nvidia-darwin-services/src/S540NvidiaDarwinWork.cpp'}
          assert record['fixed_source_profiles']['public_callback_closure'] is True
          assert record['final_public_kpi_export_audit']['status'] == 'passed'
          assert record['final_public_kpi_export_audit']['exact_target_export_proof'] is False
          PYCODE
      - name: Independently reverify, sign and package the complete idle image
        run: python3 builders/package_nvidia_idle_resume.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S540-idle-complete-image-ABI-test
          path: build/nvidia-idle-image/package-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: NVIDIA-idle-image-native-validation
          path: |
            build/nvidia-idle-image/**/*.json
            build/nvidia-idle-image/**/*.log
            build/nvidia-idle-image/**/*.o
            build/nvidia-idle-image/**/*.su
            build/nvidia-idle-image/**/*.macho
            build/nvidia-idle-image/**/*.bin
            build/nvidia-idle-image/firmware/NVIDIA-DRIVER-LICENSE.txt
          if-no-files-found: warn
          retention-days: 30
