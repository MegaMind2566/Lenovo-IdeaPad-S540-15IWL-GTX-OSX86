name: Build passive CPU sensor check

on:
  push:
    branches: [main]
    paths:
      - 'packages/cpu-sensors/**'
      - 'builders/build_cpu_sensors.py'
      - 'tests/test_cpu_sensors.sh'
      - '.github/workflows/build-cpu-sensors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify Bash 3.2 reader cleanup and filtered telemetry
        run: /bin/bash tests/test_cpu_sensors.sh
      - name: Build and verify the standalone passive package
        run: python3 builders/build_cpu_sensors.py --output-dir build/cpu-sensors
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S540-cpu-sensors
          path: |
            build/cpu-sensors/S540-cpu-sensors.zip
            build/cpu-sensors/S540-cpu-sensors.zip.sha256
          if-no-files-found: error
          retention-days: 30
