name: Build brightness-key test

on:
  push:
    branches: [main]
    paths:
      - 'builders/build_brightness_keys.py'
      - 'config/profiles/brightness-keys-assets.lock.json'
      - 'packages/function-keys/**'
      - 'licenses/brightness-keys/**'
      - 'tests/test_brightness_keys.py'
      - '.github/workflows/build-brightness-keys.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build the pinned BrightnessKeys test package
        run: python3 builders/build_brightness_keys.py --output-dir build/brightness-keys
      - name: Download the exact current EFI reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11864172878'
          run-id: '38497385533'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: build/efi-reference
      - name: Verify and extract the public EFI fixture
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, stat, zipfile
          from pathlib import Path, PurePosixPath
          source = Path('build/efi-reference/S540-Tahoe-EFI-v0.1.0.zip')
          lock = json.loads(Path('config/efi/releases/v0.1.0.json').read_text())
          assert hashlib.sha256(source.read_bytes()).hexdigest() == lock['zip_sha256']
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              for member in archive.infolist():
                  name = PurePosixPath(member.filename)
                  assert not name.is_absolute() and '..' not in name.parts and '\\' not in member.filename
                  assert not stat.S_ISLNK(member.external_attr >> 16)
              archive.extractall('build/efi-reference/baseline')
          PYCODE
      - name: Test append-only installation, guards and exact rollback
        run: python3 tests/test_brightness_keys.py build/brightness-keys/S540-brightness-keys-v2 build/efi-reference/baseline/EFI
      - name: Upload the verified test package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: S540-brightness-keys-v2
          path: |
            build/brightness-keys/S540-brightness-keys-v2.zip
            build/brightness-keys/S540-brightness-keys-v2.zip.sha256
          if-no-files-found: error
          retention-days: 30
