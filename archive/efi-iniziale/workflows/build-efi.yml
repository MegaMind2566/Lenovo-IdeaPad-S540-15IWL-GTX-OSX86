name: EFI per la prima prova

on:
  push:
    branches: [main]
    paths:
      - 'config/acpi/**'
      - 'config/usb/**'
      - 'config/profiles/**'
      - 'archive/efi-iniziale/tools/build_efi.py'
      - 'packages/recovery/tools/configure_wifi.py'
      - 'packages/recovery/*RECOVERY.cmd'
      - 'packages/recovery/*WIFI.cmd'
      - 'docs/reference/PRIMO-AVVIO.md'
      - 'archive/efi-iniziale/workflows/build-efi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assembla e valida EFI
        run: python3 archive/efi-iniziale/tools/build_efi.py
      - uses: actions/upload-artifact@v4
        with:
          name: S540-81SW-Tahoe-prima-prova
          path: |
            build/efi/S540-81SW-Tahoe-prima-prova.zip
            build/efi/manifest.json
            build/efi/ocvalidate.txt
          if-no-files-found: error
          retention-days: 30
